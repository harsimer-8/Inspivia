services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-inspivia}
      POSTGRES_USER: ${DB_USERNAME:-inspivia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inspivia} -d ${DB_NAME:-inspivia}"]
      interval: 5s
      retries: 10
  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025"]
  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inspivia}
      DB_USERNAME: ${DB_USERNAME:-inspivia}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?set AI_SERVICE_API_KEY in .env}
    ports: ["8080:8080"]
  # The AI service is built and deployed by the Python teammate. Point
  # AI_SERVICE_BASE_URL at wherever it runs; uncomment to run it here.
  # ai-service:
  #   build: ./ai-service
  #   environment:
  #     GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in the AI service environment}
  #     AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?set AI_SERVICE_API_KEY in .env}
volumes:
  pgdata:
