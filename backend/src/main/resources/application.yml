spring:
  application:
    name: inspivia-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inspivia}
    username: ${DB_USERNAME:inspivia}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

inspivia:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@inspivia.local}
  security:
    jwt-secret: ${JWT_SECRET}               # >= 32 bytes, required, no default on purpose
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}
    cookie-secure: ${COOKIE_SECURE:true}
  admin-bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    service-key: ${AI_SERVICE_API_KEY}      # sent as X-Service-Key; required, no default
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,info
